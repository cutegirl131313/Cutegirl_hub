<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CuteGirl</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      background: #0a0a0c;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap {
      width: 100%;
      max-width: 360px;
      background: #121216;
      border: 1px solid #2c2c34;
    }
    .bar { height: 2px; background: #ff2d55; }
    .box { padding: 32px 24px 28px; text-align: center; }
    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    .logo span { color: #ff2d55; }
    .msg {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .sub {
      font-size: 12px;
      color: #777;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      min-width: 140px;
      border: 1px solid #3a3a44;
      background: #1a1a20;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      cursor: pointer;
    }
    .btn:hover { background: #22222a; border-color: #ff2d55; }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn.main {
      background: #ff2d55;
      border-color: #ff2d55;
      width: 100%;
      margin-top: 8px;
    }
    .btn.main:hover { background: #e0264a; }
    #panel { display: none; text-align: left; margin-top: 20px; border: 1px solid #2c2c34; background: #0e0e12; }
    #panel.show { display: block; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #222228;
      font-size: 13px;
    }
    .row:last-child { border-bottom: 0; }
    .k { color: #888; }
    .v { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; }
    .map {
      display: block;
      text-align: center;
      padding: 12px;
      color: #ff2d55;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border-top: 1px solid #222228;
    }
    #err {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #4a1c1c;
      background: #160e0e;
      color: #f87171;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }
    #err.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar"></div>
    <div class="box">
      <div class="logo">Cute<span>Girl</span></div>
      <p class="msg">위치 확인이 필요합니다.</p>
      <p class="sub">아래 버튼을 누르면 브라우저 위치 권한이 요청됩니다.<br>허용 시 이 화면에만 좌표가 표시됩니다.</p>
      <button class="btn main" type="button" id="btn">동의 및 확인</button>
      <div id="err"></div>
      <div id="panel"></div>
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('btn');
      var panel = document.getElementById('panel');
      var err = document.getElementById('err');

      function row(k, v) {
        return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
      }

      btn.addEventListener('click', function () {
        err.classList.remove('show');
        panel.classList.remove('show');

        if (!navigator.geolocation) {
          err.textContent = '이 브라우저는 위치를 지원하지 않습니다.';
          err.classList.add('show');
          return;
        }

        btn.disabled = true;
        btn.textContent = '확인 중…';

        navigator.geolocation.getCurrentPosition(
          function (pos) {
            var lat = pos.coords.latitude.toFixed(6);
            var lon = pos.coords.longitude.toFixed(6);
            var acc = Math.round(pos.coords.accuracy);
            var html =
              row('위도', lat) +
              row('경도', lon) +
              row('정확도', '약 ' + acc + ' m') +
              '<a class="map" href="https://www.google.com/maps?q=' + lat + ',' + lon + '" target="_blank" rel="noopener">지도에서 보기</a>';

            panel.innerHTML = html;
            panel.classList.add('show');
            btn.disabled = false;
            btn.textContent = '다시 확인';

            // 한글 주소 추정 (실패해도 좌표는 유지)
            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&accept-language=ko')
              .then(function (r) { return r.json(); })
              .then(function (d) {
                if (!d || !d.display_name) return;
                var a = d.address || {};
                var sido = a.state || a.province || '';
                var sigungu = a.city || a.county || a.town || '';
                var dong = a.suburb || a.neighbourhood || a.quarter || a.village || '';
                var road = a.road || '';
                var no = a.house_number || '';
                var parts = [sido, sigungu, dong, road, no].filter(Boolean);
                var label = parts.length ? parts.join(' ') : d.display_name;
                panel.innerHTML =
                  row('위도', lat) +
                  row('경도', lon) +
                  row('정확도', '약 ' + acc + ' m') +
                  row('추정 주소', label) +
                  '<a class="map" href="https://www.google.com/maps?q=' + lat + ',' + lon + '" target="_blank" rel="noopener">지도에서 보기</a>';
              })
              .catch(function () {});
          },
          function (e) {
            var msg = '위치를 가져오지 못했습니다.';
            if (e.code === e.PERMISSION_DENIED) msg = '위치 권한이 거부되었습니다. 허용 후 다시 눌러주세요.';
            else if (e.code === e.POSITION_UNAVAILABLE) msg = '위치 정보를 사용할 수 없습니다.';
            else if (e.code === e.TIMEOUT) msg = '시간 초과. 다시 시도하세요.';
            err.textContent = msg;
            err.classList.add('show');
            btn.disabled = false;
            btn.textContent = '동의 및 확인';
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      });
    })();
  </script>
</body>
</html>
