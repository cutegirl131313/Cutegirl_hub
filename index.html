<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CG · Access Denied</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0f;
      color: #f4f1f5;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 24px;
      text-align: center;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.45rem;
      letter-spacing: 0.04em;
      color: #1a1218;
      background: linear-gradient(135deg, #f0a3c2, #c77db0);
      box-shadow: 0 10px 28px rgba(240, 163, 194, 0.28);
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0d0d0;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">CG</div>
    <h1>페이지를 볼 권한이 없습니다</h1>
  </div>

</html>
